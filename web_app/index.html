<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI AR Campus Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <div id="login-screen" class="flex-1 flex items-center justify-center bg-green-700">
        <div class="bg-white p-8 rounded-lg shadow-lg text-center w-96">
            <h1 class="text-2xl font-bold text-green-700 mb-4">AI AR Campus Explorer</h1>
            <p class="text-gray-500 mb-6">Đăng nhập để kết nối Trợ lý AI</p>
            <button onclick="connectAI()" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded hover:bg-green-700 transition">
                Vào không gian Web
            </button>
        </div>
    </div>

    <div id="chat-screen" class="hidden flex-col h-screen max-w-2xl mx-auto w-full bg-white shadow-xl">
        <div class="bg-green-700 text-white p-4 font-bold text-lg flex justify-between items-center">
            <span>🤖 Trợ lý AI HCMUS</span>
            <span id="status-dot" class="text-sm text-yellow-300">Đang kết nối...</span>
        </div>
        
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col space-y-4">
            </div>

        <div class="p-4 bg-white border-t flex space-x-2">
            <input type="text" id="message-input" placeholder="Bạn cần tìm đường đi đâu?" 
                   class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-green-500"
                   onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">
                Gửi
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
